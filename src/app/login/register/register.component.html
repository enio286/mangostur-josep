<div class="auth-container">
    <div class="auth-card">
      <div class="card shadow">
        <div class="card-body">
          <h2 class="text-center mb-4">Crear Cuenta</h2>
          
          <form (ngSubmit)="onRegister()" #registerForm="ngForm">
            <!-- Nombre -->
            <div class="form-group mb-3">
              <label for="name">Nombre Completo</label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fas fa-user"></i>
                </span>
                <input 
                  type="text" 
                  class="form-control" 
                  id="name" 
                  name="name"
                  [(ngModel)]="registerData.nombre"
                  required
                  #name="ngModel">
              </div>
              <div class="invalid-feedback" *ngIf="name.invalid && name.touched">
                El nombre es requerido
              </div>
            </div>
  
            <!-- Email -->
            <div class="form-group mb-3">
              <label for="email">Correo Electrónico</label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fas fa-envelope"></i>
                </span>
                <input 
                  type="email" 
                  class="form-control" 
                  id="email" 
                  name="email"
                  [(ngModel)]="registerData.email"
                  required
                  email
                  #email="ngModel">
              </div>
              <div class="invalid-feedback" *ngIf="email.invalid && email.touched">
                Por favor ingrese un correo válido
              </div>
            </div>
  
            <!-- Teléfono -->
            <div class="form-group mb-3">
              <label for="telefono">Teléfono</label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fas fa-phone"></i>
                </span>
                <input 
                  type="tel" 
                  class="form-control" 
                  id="telefono" 
                  name="telefono"
                  [(ngModel)]="registerData.telefono"
                  required
                  pattern="[0-9]{10}"
                  #telefono="ngModel">
              </div>
              <div class="invalid-feedback" *ngIf="telefono.invalid && telefono.touched">
                Por favor ingrese un número de teléfono válido (10 dígitos)
              </div>
            </div>
  
            <!-- Dirección -->
            <div class="form-group mb-3">
              <label for="direccion">Dirección</label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fas fa-home"></i>
                </span>
                <input 
                  type="text" 
                  class="form-control" 
                  id="direccion" 
                  name="direccion"
                  [(ngModel)]="registerData.direccion"
                  required
                  #direccion="ngModel">
              </div>
              <div class="invalid-feedback" *ngIf="direccion.invalid && direccion.touched">
                La dirección es requerida
              </div>
            </div>
  
            <!-- Contraseña -->
            <div class="form-group mb-3">
              <label for="password">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fas fa-lock"></i>
                </span>
                <input 
                  [type]="showPassword ? 'text' : 'password'"
                  class="form-control" 
                  id="password"
                  name="password"
                  [(ngModel)]="registerData.password"
                  required
                  minlength="6"
                  #password="ngModel">
                <button 
                  type="button" 
                  class="btn btn-outline-secondary" 
                  (click)="togglePassword()">
                  <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                </button>
              </div>
              <div class="invalid-feedback" *ngIf="password.invalid && password.touched">
                La contraseña debe tener al menos 6 caracteres
              </div>
            </div>
  
            <button 
              type="submit" 
              class="btn btn-success w-100 mb-3"
              [disabled]="registerForm.invalid">
              Crear Cuenta
            </button>
          </form>
  
          <div class="text-center">
            <p>¿Ya tienes cuenta? <a href="/login">Inicia Sesión</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
